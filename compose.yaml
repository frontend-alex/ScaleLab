services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "9000:3000"
    env_file:
      - .env
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "9001:3001"
    env_file:
      - .env
